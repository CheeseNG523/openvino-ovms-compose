# OpenVINO Model Server — Docker Compose (windows branch)
# Profiles: cpu | gpu  — Docker Desktop WSL2 + Linux OVMS image (NOT Windows containers)
#   docker compose --profile cpu up
#   docker compose --profile gpu up
# Image pin: openvino/model_server:2026.4.0-gpu (official Linux Hub image)
#
# WARNING: Enable only ONE profile at a time. Starting two (e.g. cpu+gpu)
# is unsupported — they share the same host REST/gRPC ports and will clash.
#
# NPU via Compose on Windows/WSL2 is OUT OF SCOPE (no usable /dev/accel in WSL2).
# Use native Windows ovms.exe or the sibling linux branch on bare-metal Linux.
#
# Non-goal: multi-GPU tensor parallel (OVMS GH #3816).

x-ovms-common: &ovms-common
  image: openvino/model_server:2026.4.0-gpu
  volumes:
    - ./models:/models:rw
    - ./scripts/entrypoint.sh:/usr/local/bin/ovms-entrypoint.sh:ro
  entrypoint: ["/bin/bash", "/usr/local/bin/ovms-entrypoint.sh"]
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    API_KEY: ${API_KEY:-}
    ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-0}
    DYNAMIC_SPLIT_FUSE: ${DYNAMIC_SPLIT_FUSE:-0}
    IDLE_UNLOAD_TIMEOUT_SECONDS: ${IDLE_UNLOAD_TIMEOUT_SECONDS:-}
    # OVMS_DEVICE set per profile (CPU|GPU) for entrypoint prefix-cache / DSF logic
  ports:
    - "${REST_PORT:-8000}:${REST_PORT:-8000}"
    - "${GRPC_PORT:-9000}:${GRPC_PORT:-9000}"
  # Model --pull + load can be slow; start_period is intentionally generous.
  # Image may lack curl — try curl, then wget, else fail closed (see README).
  # When API_KEY is set, probe sends Authorization: Bearer (auth-aware).
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "AUTH=\"\"; if [ -n \"$${API_KEY}\" ]; then AUTH=\"Authorization: Bearer $${API_KEY}\"; fi; if command -v curl >/dev/null 2>&1; then if [ -n \"$$AUTH\" ]; then curl -sf -H \"$$AUTH\" http://127.0.0.1:${REST_PORT:-8000}/v1/models >/dev/null; else curl -sf http://127.0.0.1:${REST_PORT:-8000}/v1/models >/dev/null; fi; elif command -v wget >/dev/null 2>&1; then if [ -n \"$$AUTH\" ]; then wget -q -O /dev/null --header=\"$$AUTH\" http://127.0.0.1:${REST_PORT:-8000}/v1/models; else wget -q -O /dev/null http://127.0.0.1:${REST_PORT:-8000}/v1/models; fi; else echo 'healthcheck: neither curl nor wget in image' >&2; exit 1; fi",
      ]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 300s
  restart: unless-stopped

services:
  # --- CPU: no device binds ---
  ovms-cpu:
    <<: *ovms-common
    profiles: ["cpu"]
    container_name: ovms-cpu
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      API_KEY: ${API_KEY:-}
      ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-0}
      DYNAMIC_SPLIT_FUSE: ${DYNAMIC_SPLIT_FUSE:-0}
      IDLE_UNLOAD_TIMEOUT_SECONDS: ${IDLE_UNLOAD_TIMEOUT_SECONDS:-}
      OVMS_DEVICE: CPU
    command:
      - --rest_port
      - "${REST_PORT:-8000}"
      - --port
      - "${GRPC_PORT:-9000}"
      - --model_repository_path
      - /models
      - --source_model
      - "${SOURCE_MODEL:-OpenVINO/Qwen2.5-1.5B-Instruct-int4-ov}"
      - --task
      - text_generation
      - --target_device
      - CPU
      - --pull
      - --cache_dir
      - /models/.ovms_cache
      - --cache_size
      - "${CACHE_SIZE:-10}"
      - --max_num_seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max_num_batched_tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - --kv_cache_precision
      - "${KV_CACHE_PRECISION:-u8}"
    # Optional host user mapping — LEFT COMMENTED on purpose (root in container is OK for many hosts).
    # Uncomment ONLY if ./models hits permission errors:
    # user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  # --- GPU: Docker Desktop WSL2 — /dev/dxg + WSL libs (NOT /dev/dri + RENDER_GID) ---
  # Experimental until LP-W-GPU proven. If Level Zero needs it, try
  # LD_LIBRARY_PATH=/usr/lib/wsl/lib (document as LP-W-GPU-LDLP finding).
  # No group_add / RENDER_GID on this path.
  ovms-gpu:
    <<: *ovms-common
    profiles: ["gpu"]
    container_name: ovms-gpu
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - ./models:/models:rw
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ./scripts/entrypoint.sh:/usr/local/bin/ovms-entrypoint.sh:ro
    # RENDER_GID / group_add intentionally omitted (linux-branch pattern; wrong for DD WSL2).
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      API_KEY: ${API_KEY:-}
      ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-0}
      DYNAMIC_SPLIT_FUSE: ${DYNAMIC_SPLIT_FUSE:-0}
      IDLE_UNLOAD_TIMEOUT_SECONDS: ${IDLE_UNLOAD_TIMEOUT_SECONDS:-}
      OVMS_DEVICE: GPU
      # Optional: uncomment if smoke needs WSL lib path (LP-W-GPU-LDLP):
      # LD_LIBRARY_PATH: /usr/lib/wsl/lib
    # user: LEFT COMMENTED on purpose. Uncomment ONLY on permission errors:
    # user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - --rest_port
      - "${REST_PORT:-8000}"
      - --port
      - "${GRPC_PORT:-9000}"
      - --model_repository_path
      - /models
      - --source_model
      - "${SOURCE_MODEL:-OpenVINO/Qwen2.5-1.5B-Instruct-int4-ov}"
      - --task
      - text_generation
      - --target_device
      - GPU
      - --pull
      - --cache_dir
      - /models/.ovms_cache
      - --cache_size
      - "${CACHE_SIZE:-10}"
      - --max_num_seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max_num_batched_tokens
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - --kv_cache_precision
      - "${KV_CACHE_PRECISION:-u8}"
